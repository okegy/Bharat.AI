<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" width="800" height="1050">
  <!-- Page background -->
  <rect width="800" height="1050" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
  
  <!-- Header Border -->
  <rect x="25" y="25" width="750" height="1000" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Form Header -->
  <g transform="translate(40, 45)">
    <!-- Government Seal -->
    <circle cx="50" cy="40" r="30" fill="#0A3A60" />
    <text x="50" y="47" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFD700" text-anchor="middle">GOI</text>

    <text x="360" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="bold" fill="#0A3A60" text-anchor="middle">
      प्रधानमंत्री किसान सम्मान निधि (PM-KISAN)
    </text>
    <text x="360" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#334155" text-anchor="middle">
      PRADHAN MANTRI KISAN SAMMAN NIDHI REGISTRATION FORM
    </text>
    <text x="360" y="75" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle">
      कृषि एवं किसान कल्याण मंत्रालय, भारत सरकार
    </text>
  </g>

  <!-- Photo Box Top Right -->
  <rect x="635" y="45" width="120" height="140" fill="#F8FAFC" stroke="#94A3B8" stroke-dasharray="4,3" />
  <text x="695" y="115" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#94A3B8" text-anchor="middle">Affix Photo Here</text>

  <!-- Section 1: Farmer Personal Details -->
  <rect x="40" y="170" width="580" height="32" fill="#0F766E" rx="4" />
  <text x="55" y="192" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">
    1. व्यक्तिगत विवरण / PERSONAL DETAILS OF APPLICANT
  </text>

  <!-- Field 1: Farmer Name -->
  <g transform="translate(45, 215)">
    <text x="0" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B">1.1 आवेदक का पूरा नाम / Full Name:</text>
    <rect x="0" y="25" width="560" height="35" fill="#F8FAFC" stroke="#94A3B8" rx="4" />
    <text x="15" y="48" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">RAMESH KUMAR SHARMA</text>
  </g>

  <!-- Field 2: Father / Husband Name -->
  <g transform="translate(45, 285)">
    <text x="0" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B">1.2 पिता/पति का नाम / Father's or Husband's Name:</text>
    <rect x="0" y="25" width="560" height="35" fill="#F8FAFC" stroke="#94A3B8" rx="4" />
    <text x="15" y="48" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">HARI OM SHARMA</text>
  </g>

  <!-- Field 3: Gender & DOB -->
  <g transform="translate(45, 355)">
    <text x="0" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B">1.3 लिंग / Gender:</text>
    <rect x="0" y="25" width="160" height="35" fill="#F8FAFC" stroke="#94A3B8" rx="4" />
    <text x="15" y="48" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Male / पुरुष</text>

    <text x="180" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B">1.4 जन्म तिथि / Date of Birth:</text>
    <rect x="180" y="25" width="170" height="35" fill="#F8FAFC" stroke="#94A3B8" rx="4" />
    <text x="195" y="48" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">15/08/1984</text>

    <text x="370" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B">1.5 वर्ग / Category:</text>
    <rect x="370" y="25" width="190" height="35" fill="#F8FAFC" stroke="#94A3B8" rx="4" />
    <text x="385" y="48" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">General / सामान्य</text>
  </g>

  <!-- Section 2: Identification & Bank Details -->
  <rect x="40" y="445" width="715" height="32" fill="#0F766E" rx="4" />
  <text x="55" y="467" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">
    2. पहचान एवं बैंक विवरण / IDENTITY &amp; BANK ACCOUNT DETAILS
  </text>

  <!-- Aadhaar & Mobile -->
  <g transform="translate(45, 490)">
    <text x="0" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B">2.1 आधार संख्या / Aadhaar Number (12 Digits):</text>
    <rect x="0" y="25" width="345" height="35" fill="#F8FAFC" stroke="#94A3B8" rx="4" />
    <text x="15" y="48" font-family="'Consolas', monospace" font-size="16" font-weight="bold" fill="#0F172A">4767 1659 1624</text>

    <text x="365" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B">2.2 मोबाइल नंबर / Mobile Number:</text>
    <rect x="365" y="25" width="345" height="35" fill="#F8FAFC" stroke="#94A3B8" rx="4" />
    <text x="380" y="48" font-family="'Consolas', monospace" font-size="16" font-weight="bold" fill="#0F172A">98765 43210</text>
  </g>

  <!-- Bank Account & IFSC -->
  <g transform="translate(45, 565)">
    <text x="0" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B">2.3 बैंक खाता संख्या / Bank Account Number:</text>
    <rect x="0" y="25" width="345" height="35" fill="#F8FAFC" stroke="#94A3B8" rx="4" />
    <text x="15" y="48" font-family="'Consolas', monospace" font-size="16" font-weight="bold" fill="#0F172A">30981245678</text>

    <text x="365" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B">2.4 बैंक IFSC कोड / Bank IFSC Code:</text>
    <rect x="365" y="25" width="345" height="35" fill="#F8FAFC" stroke="#94A3B8" rx="4" />
    <text x="380" y="48" font-family="'Consolas', monospace" font-size="16" font-weight="bold" fill="#0F172A">SBIN0001234</text>
  </g>

  <!-- Section 3: Land & Residential Address Details -->
  <rect x="40" y="655" width="715" height="32" fill="#0F766E" rx="4" />
  <text x="55" y="677" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">
    3. भूमि एवं निवास विवरण / LAND HOLDING &amp; RESIDENTIAL ADDRESS
  </text>

  <!-- Full Address -->
  <g transform="translate(45, 700)">
    <text x="0" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B">3.1 पूरा पता / Permanent Address:</text>
    <rect x="0" y="25" width="710" height="35" fill="#F8FAFC" stroke="#94A3B8" rx="4" />
    <text x="15" y="48" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">House No 42, Village Rampur, Post Shivpur, Tehsil Sadar</text>
  </g>

  <!-- District, State, Pincode -->
  <g transform="translate(45, 770)">
    <text x="0" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B">3.2 जिला / District:</text>
    <rect x="0" y="25" width="220" height="35" fill="#F8FAFC" stroke="#94A3B8" rx="4" />
    <text x="15" y="48" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Varanasi</text>

    <text x="245" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B">3.3 राज्य / State:</text>
    <rect x="245" y="25" width="220" height="35" fill="#F8FAFC" stroke="#94A3B8" rx="4" />
    <text x="260" y="48" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Uttar Pradesh</text>

    <text x="490" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B">3.4 पिन कोड / Pincode:</text>
    <rect x="490" y="25" width="220" height="35" fill="#F8FAFC" stroke="#94A3B8" rx="4" />
    <text x="505" y="48" font-family="'Consolas', monospace" font-size="16" font-weight="bold" fill="#0F172A">221001</text>
  </g>

  <!-- Farmer Land Area -->
  <g transform="translate(45, 840)">
    <text x="0" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B">3.5 भूमि स्वामित्व (हेक्टेयर में) / Land Holding (in Hectares):</text>
    <rect x="0" y="25" width="345" height="35" fill="#F8FAFC" stroke="#94A3B8" rx="4" />
    <text x="15" y="48" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">1.8 Hectares (Small/Marginal)</text>

    <text x="365" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B">3.6 खसरा/खतौनी संख्या / Land Survey No:</text>
    <rect x="365" y="25" width="345" height="35" fill="#F8FAFC" stroke="#94A3B8" rx="4" />
    <text x="380" y="48" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">KH-492 / PLOT 12</text>
  </g>

  <!-- Declaration & Signatures -->
  <g transform="translate(45, 920)">
    <text x="0" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#475569">
      घोषणा: मैं प्रमाणित करता/करती हूँ कि ऊपर दी गई सभी जानकारियाँ सत्य एवं सही हैं।
    </text>
    <text x="0" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#475569">
      Declaration: I hereby declare that all information given above is true and correct to the best of my knowledge.
    </text>

    <!-- Signatures -->
    <text x="80" y="85" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#1E293B">दिनांक / Date: 27/09/2026</text>
    <text x="560" y="85" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#1E293B">आवेदक के हस्ताक्षर / Signature</text>
  </g>
</svg>

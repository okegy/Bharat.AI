<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540" width="856" height="540">
  <!-- Card Background -->
  <defs>
    <linearGradient id="flag" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#138808" />
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF8" />
      <stop offset="100%" stop-color="#F4EFE6" />
    </linearGradient>
  </defs>

  <rect width="856" height="540" rx="24" fill="url(#bg)" stroke="#D4AF37" stroke-width="3" />
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="856" height="75" rx="24" fill="#FFFFFF" />
  <rect x="0" y="55" width="856" height="20" fill="url(#flag)" opacity="0.85" />
  
  <!-- Emblem & Government Header -->
  <circle cx="65" cy="38" r="24" fill="#0A3A60" />
  <text x="65" y="44" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFD700" text-anchor="middle">GOI</text>
  
  <text x="110" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#0A3A60">भारत सरकार</text>
  <text x="110" y="50" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#0A3A60">GOVERNMENT OF INDIA</text>
  
  <text x="790" y="40" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="bold" fill="#FF3E3E" text-anchor="end">आधार</text>
  <text x="790" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#0A3A60" text-anchor="end">AADHAAR</text>

  <!-- Photo Box -->
  <g transform="translate(45, 110)">
    <rect width="180" height="225" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2" />
    <!-- Silhouette Avatar -->
    <circle cx="90" cy="85" r="42" fill="#64748B" />
    <path d="M 30 205 C 30 145, 150 145, 150 205 Z" fill="#64748B" />
    <rect x="0" y="225" width="180" height="25" fill="#0A3A60" rx="4" />
    <text x="90" y="242" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SAMPLE CARD FOR TESTING</text>
  </g>

  <!-- Citizen Details -->
  <!-- Hindi -->
  <text x="255" y="145" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="bold" fill="#1E293B">रमेश कुमार शर्मा</text>
  <!-- English -->
  <text x="255" y="178" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Ramesh Kumar Sharma</text>
  
  <text x="255" y="220" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#475569">पिता का नाम / Father's Name:</text>
  <text x="255" y="245" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E293B">हरि ओम शर्मा / Hari Om Sharma</text>

  <text x="255" y="285" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#475569">जन्म तिथि / DOB:</text>
  <text x="400" y="285" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E293B">15/08/1984</text>
  
  <text x="255" y="320" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#475569">लिंग / Gender:</text>
  <text x="375" y="320" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E293B">पुरुष / Male</text>

  <!-- Mock QR Code Box -->
  <g transform="translate(635, 125)">
    <rect width="170" height="170" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <!-- QR Finder patterns -->
    <rect x="15" y="15" width="40" height="40" fill="#0F172A" />
    <rect x="23" y="23" width="24" height="24" fill="#FFFFFF" />
    <rect x="29" y="29" width="12" height="12" fill="#0F172A" />

    <rect x="115" y="15" width="40" height="40" fill="#0F172A" />
    <rect x="123" y="23" width="24" height="24" fill="#FFFFFF" />
    <rect x="129" y="29" width="12" height="12" fill="#0F172A" />

    <rect x="15" y="115" width="40" height="40" fill="#0F172A" />
    <rect x="23" y="123" width="24" height="24" fill="#FFFFFF" />
    <rect x="29" y="129" width="12" height="12" fill="#0F172A" />

    <!-- Matrix dots -->
    <rect x="65" y="20" width="10" height="10" fill="#0F172A" />
    <rect x="85" y="35" width="15" height="10" fill="#0F172A" />
    <rect x="65" y="65" width="40" height="40" fill="#0F172A" />
    <rect x="75" y="75" width="20" height="20" fill="#FFFFFF" />
    <rect x="115" y="75" width="15" height="15" fill="#0F172A" />
    <rect x="135" y="105" width="20" height="10" fill="#0F172A" />
    <rect x="70" y="125" width="25" height="15" fill="#0F172A" />
    <rect x="110" y="135" width="35" height="15" fill="#0F172A" />
    
    <text x="85" y="195" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#64748B" text-anchor="middle">SECURE QR CODE</text>
  </g>

  <!-- Separator Line -->
  <line x1="45" y1="390" x2="810" y2="390" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Aadhaar Number (Large bold digits) -->
  <text x="428" y="445" font-family="'Consolas', 'Courier New', monospace" font-size="36" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="4">
    4767  1659  1624
  </text>
  
  <text x="428" y="475" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#E11D48" text-anchor="middle">
    मेरा आधार, मेरी पहचान
  </text>

  <!-- Footer Red Wave Accent -->
  <rect x="0" y="515" width="856" height="25" rx="12" fill="#E11D48" />
  <text x="428" y="532" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    UNIQUE IDENTIFICATION AUTHORITY OF INDIA • DEMO DATA FOR HACKATHON
  </text>
</svg>
